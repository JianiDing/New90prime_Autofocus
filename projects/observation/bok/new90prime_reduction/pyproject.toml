[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccdtools"
version = "0.0.1"
description = "CCD utilities and bad-pixel masking tools"
readme = "README.md"
requires-python = ">=3.8"
authors = [ { name = "Jiani Ding", email = "jiani.ding@example.com" } ]
 
dependencies = [
  "numpy>=1.21",
  "astropy",
  "matplotlib"
]

[project.scripts]
# Installs a command-line entry point `ccdtools` that calls ccdtools.cli:main
ccdtools = "ccdtools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ccdtools"]
